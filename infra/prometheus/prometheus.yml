global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # vLLM-style metrics from the simulator. When pointing at a real vLLM server,
  # add it as another target here; the metric names are the same.
  - job_name: inference
    metrics_path: /metrics
    static_configs:
      - targets: ["inference-sim:8000"]
        labels:
          backend: sim

  # Added in Phase 1:
