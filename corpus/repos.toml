# Source code used to build realistic prompts (Phase 1, decision 5B + follow-up B).
#
# Every repo is pinned to a full commit SHA so the corpus is reproducible, and
# carries the SHA-256 of its license file as it was reviewed. `relay-corpus fetch`
# refuses to build the corpus if the license file at that commit doesn't match.
#
# Allowed licenses: MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause.
# Code is fetched locally into data/corpus/ and is not committed to this repo.

[defaults]
max_files = 30
min_bytes = 1024
max_bytes = 40960

[[repo]]
name = "requests"
url = "https://github.com/psf/requests"
commit = "611c6162cbc4ac2020a2f91c7cfa4f3abf9bbb60"
language = "python"
extensions = [".py"]
include_dirs = ["src", "tests"]
license = "Apache-2.0"
license_file = "LICENSE"
license_sha256 = "09e8a9bcec8067104652c168685ab0931e7868f9c8284b66f5ae6edae5f1130b"

