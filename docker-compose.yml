# Local stack for the Relay case study.
# Everything here runs without an AWS account, an API key or a GPU.

x-relay: &relay
  build: .
  image: relay:local
  environment: &relay-env
    INFERENCE_BASE_URL: http://inference-sim:8000/v1
    INFERENCE_METRICS_URL: http://inference-sim:8000/metrics
    INFERENCE_BACKEND: sim
    # The simulator serves one model name, so embeddings use it too. Real runs set these separately.
    COMPLETION_MODEL: relay/code-7b
    EMBEDDING_MODEL: relay/code-7b
    GATEWAY_URL: http://gateway:8080
    AWS_ENDPOINT_URL: http://floci:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test

services:
  # Customer's AWS environment (S3, SQS, DynamoDB) at localhost:4566.
  floci:
    image: floci/floci:latest  # pin to a release (e.g. floci/floci:x.y.z) once Phase 1 is stable
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci          # so returned URLs (e.g. SQS QueueUrl) resolve from other containers
      FLOCI_STORAGE_MODE: memory     # ephemeral: every `make up` starts clean
      FLOCI_SERVICES_UI_ENABLED: "false"

  # OpenAI-compatible stand-in for vLLM, used for scale tests.
  # Latency values are placeholders until Phase 3 calibrates them from real GPU runs
  # (see docs/methodology.md, rule 3). Check units against the simulator's configuration docs.
  inference-sim:
    image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.0
    ports:
      - "8000:8000"
    command:
      - --model=relay/code-7b
      - --port=8000
      - --mode=random
      - --time-to-first-token=150ms
      - --time-to-first-token-std-dev=30ms
      - --inter-token-latency=20ms
      - --inter-token-latency-std-dev=5ms
      - --max-num-seqs=8
      - --time-factor-under-load=2.0

  # Creates the indexing queue and results table, then exits.
  bootstrap:
    <<: *relay
    command: ["relay-bootstrap"]
    depends_on:
      - floci
    restart: on-failure

  # Relay's API (decision 1B), streaming through to inference (decision 2A).
  gateway:
    <<: *relay
    command: ["relay-gateway"]
    ports:
      - "8080:8080"
    depends_on:
      - inference-sim

  # Repo-indexing worker with bounded concurrency (decision 6B).
  worker:
    <<: *relay
    command: ["relay-worker"]
    environment:
      <<: *relay-env
      WORKER_MAX_IN_FLIGHT: "8"
    ports:
      - "9101:9101"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      inference-sim:
        condition: service_started

  # Load generator: run on demand, e.g. `make run TRACE=traces/smoke.jsonl`.
  loadgen:
    <<: *relay
    profiles: ["tools"]
    command: ["relay-loadgen", "--help"]
    volumes:
      - ./data:/app/data:ro
      - ./traces:/app/traces:ro
      - ./results:/app/results
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - inference-sim
      - gateway

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: admin  # local only
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
