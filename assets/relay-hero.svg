<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
<title id="title">Relay — Engineering inference at scale</title>
<desc id="desc">Pastel mint, aqua and ice-blue banner. Left: the Relay wordmark and tagline. Right: completion and agent-chat requests enter a Relay gateway, which routes them to an OpenAI-compatible backend (llama.cpp on CPU, measured; a simulator for plumbing; vLLM on GPU, planned) and streams responses back.</desc>
<style>
  .sans { font-family: Arial, Helvetica, sans-serif; }
  @media (max-width: 640px) {
    .detail, .chips { display: none; }
    .main { transform: translateY(7px); }
  }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#E4FBEF"/>
    <stop offset="0.52" stop-color="#D3F4F3"/>
    <stop offset="1" stop-color="#E2EEFD"/>
  </linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0F5C63"/>
    <stop offset="0.6" stop-color="#1F7D8C"/>
    <stop offset="1" stop-color="#2E78A8"/>
  </linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0L10 5L0 10z" fill="#3E929C"/>
  </marker>
</defs>

<rect width="1200" height="350" rx="26" fill="url(#bg)"/>
<circle cx="1085" cy="22" r="150" fill="#FFFFFF" opacity=".28"/>
<circle cx="1135" cy="318" r="150" fill="#CBEFF2" opacity=".40"/>
<circle cx="560" cy="350" r="120" fill="#D7F6E6" opacity=".45"/>

