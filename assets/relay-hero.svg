<text class="sans" x="70" y="175" font-size="82" font-weight="800" fill="url(#ink)">Relay</text>
<text class="sans" x="75" y="226" font-size="27" font-weight="500" fill="#24484D">Engineering inference at scale</text>
<text class="sans chips" x="75" y="277" font-size="19" fill="#4F7378">Gateway  ·  Prefix caching  ·  Reproducible runs</text>

<g fill="none" stroke="#3E929C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" opacity=".85">
  <path d="M730 132 C760 132 762 160 788 160" marker-end="url(#arrow)"/>
